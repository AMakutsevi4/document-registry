spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/document-registry_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:password}
    driver-class-name: org.postgresql.Driver

  jpa:
    database: POSTGRESQL
    hibernate:
      ddl-auto: update
    show-sql: true

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    drop-first: ${LIQUIBASE_DROP_FIRST:false}

generator:
   n: ${GENERATOR_N:1000}
   api-url: ${GENERATOR_URL:http://localhost:8080/api/v1/documents}

app:
  batch-size: ${BATCH_SIZE:500}